name: "Search monitor"

# Runs the fixed latency probe against production twice an hour. A run fails
# when a probe is not a 200 or a path's p95 is over its budget, and GitHub
# mails the failure to the repository owner. The probe set is fixed and cheap
# on purpose: a monitor must never be able to send an expensive query.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: search-monitor

jobs:
  probe:
    name: search latency probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.7"

      - name: Probe production search
        run: deno run --allow-net --allow-env --no-config web/scripts/search-probe.ts
