apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dmozdb
spec:
  serviceName: dmozdb
  # Single writer: the backend owns one on-disk database. Scaling out is a
  # protocol/replication change, not a replica bump.
  replicas: 1
  selector:
    matchLabels:
      app: dmozdb
  template:
    metadata:
      labels:
        app: dmozdb
    spec:
      # The "dmozdb" Service would inject DMOZDB_PORT=tcp://<ip>:8080 as a
      # legacy service-link env var, clobbering the backend's own DMOZDB_PORT.
      # The app needs no service-link vars, so disable them.
      enableServiceLinks: false
      # On SIGTERM dmozdb checkpoints and then writes the derived-index snapshot
      # (~0.8 GB at the volume's ~24 MB/s); the 30 s default would SIGKILL it
      # mid-write and the next boot would rescan the store for fifteen minutes.
      terminationGracePeriodSeconds: 300
      containers:
        - name: dmozdb
          image: dmozdb-backend:latest
          ports:
            - containerPort: 8080
              name: dmozdb
          # The frontend now runs in a separate pod and reaches the backend over
          # the cluster network, so the backend binds 0.0.0.0 and trusts the
          # flannel pod CIDR (10.244.0.0/16) plus the node subnet (10.0.1.0/24,
          # the source of kubelet tcpSocket probes). Without the node subnet the
          # startup/liveness probe connection is rejected at accept.
          env:
            - name: DMOZDB_BIND
              value: "0.0.0.0"
            - name: DMOZDB_PORT
              value: "8080"
            - name: DMOZDB_TRUSTED
              value: "10.244.0.0/16,10.0.1.0/24"
            - name: DMOZDB_CACHE_SIZE_MB
              value: "256"
            - name: DMOZDB_THREAD_COUNT
              value: "4"
            # Domain-filter link searches failed with a generic error at the 32 MiB
            # default; 128 MiB cleared them on the live fleet (2026-10-28).
            - name: DMOZDB_SCRATCH_SLAB_MB
              value: "128"
            # The verifier rescans the whole 17 GB store (15 min per pass);
            # links are rarely added, so one pass a month is plenty. The
            # run_verifier op still triggers a pass on demand.
            - name: DMOZDB_VERIFIER_INTERVAL_S
              value: "2592000"
          volumeMounts:
            - name: data
              mountPath: /var/lib/dmozdb
          # The backend speaks a raw binary protocol, not HTTP, so probes use a
          # bare TCP connect. A dead backend stops accepting on 8080 → the probe
          # fails → the pod restarts.
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 3
            failureThreshold: 100
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "3Gi"
              cpu: "250m"
            limits:
              # Raised from the combined image's 1000m now that the CPU-heavy
              # Deno SSR runs in its own pod and no longer shares this budget.
              # Memory: the full 3.04M-link store runs at 3.6 GB RSS (int8 link
              # vectors, PQ codes, category vectors, facts and entities).
              memory: "5Gi"
              cpu: "1500m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
