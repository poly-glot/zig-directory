apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: dmozdb

patches:
- path: statefulset.yaml
- path: web.yaml
- path: mcp.yaml
- path: ingress.yaml

# The CD pipeline rewrites every newTag to the built commit SHA via
# `kustomize edit set image dmozdb-backend=<repo>:<sha>-backend ...` before
# applying. All three images share the one OCIR repo, distinguished by tag
# suffix.
images:
- name: dmozdb-backend
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: 05a20c6929d9a6bd9bb2acec5ecb909a0536327e-backend
- name: dmozdb-mcp
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: 05a20c6929d9a6bd9bb2acec5ecb909a0536327e-mcp
- name: dmozdb-web
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: 05a20c6929d9a6bd9bb2acec5ecb909a0536327e-web
