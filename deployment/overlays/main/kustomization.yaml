apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: dmozdb

patches:
- path: statefulset.yaml
- path: web.yaml
- path: mcp.yaml
- path: ingress.yaml

# The CD pipeline rewrites every newTag to the built commit SHA via
# `kustomize edit set image dmozdb-backend=<repo>:<sha>-backend ...` before
# applying. All three images share the one OCIR repo, distinguished by tag
# suffix.
images:
- name: dmozdb-backend
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: 457cf0ab45297ffffa219af167aa3cd65eed228b-backend
- name: dmozdb-mcp
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: 50fa321af99af3b38f50d021655cc880decaa48c-mcp
- name: dmozdb-web
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: 50fa321af99af3b38f50d021655cc880decaa48c-web
