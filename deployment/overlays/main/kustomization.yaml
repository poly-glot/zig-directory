apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: dmozdb

patches:
- path: statefulset.yaml
- path: web.yaml
- path: mcp.yaml
- path: ingress.yaml

# The CD pipeline rewrites every newTag to the built commit SHA via
# `kustomize edit set image dmozdb-backend=<repo>:<sha>-backend ...` before
# applying. All three images share the one OCIR repo, distinguished by tag
# suffix.
images:
- name: dmozdb-backend
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: 937ad27039f9b4f80102c13a5ca02c75a390a137-backend
- name: dmozdb-mcp
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: 8cf6a0385f0e08f97d8bd41225d4c7a613fb28b3-mcp
- name: dmozdb-web
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: 8cf6a0385f0e08f97d8bd41225d4c7a613fb28b3-web
