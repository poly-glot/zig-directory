apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: dmozdb

patches:
- path: statefulset.yaml
- path: web.yaml
- path: mcp.yaml
- path: ingress.yaml

# The CD pipeline rewrites every newTag to the built commit SHA via
# `kustomize edit set image dmozdb-backend=<repo>:<sha>-backend ...` before
# applying. All three images share the one OCIR repo, distinguished by tag
# suffix.
images:
- name: dmozdb-backend
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: c97f2578683b966bf2e6e10fd667223736dadc0f-backend
- name: dmozdb-mcp
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: c97f2578683b966bf2e6e10fd667223736dadc0f-mcp
- name: dmozdb-web
  newName: lhr.ocir.io/lrhvckxzwf3l/zig-directory
  newTag: c97f2578683b966bf2e6e10fd667223736dadc0f-web
