[project]
name = "dmozdb-mcp"
version = "0.1.0"
description = "MCP server projecting the dmozdb JSON API"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.3,<5",
    "httpx2>=2.13,<3",
    "mcp-types>=2.2,<3",
    "prefab-ui>=0.20.2",
    "pydantic>=2.13,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"server.py" = ["F401"]
"test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["fastmcp.*", "prefab_ui.*", "httpx2.*", "mcp_types.*"]
ignore_missing_imports = true
