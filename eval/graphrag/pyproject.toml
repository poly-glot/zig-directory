[project]
name = "graphrag-eval"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mlx-lm>=0.28",
    "mlx-embeddings>=0.0.4",
    "numpy>=2",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "spacy>=3.8",
    "rank-bm25>=0.2.2",
    "en-core-web-sm",
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
